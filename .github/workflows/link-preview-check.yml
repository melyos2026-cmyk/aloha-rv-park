# Oct 21 (per Mely): read-only check of what WhatsApp/Facebook see when a link is shared.
name: Link preview check
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Space-separated URLs'
        required: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          URLS: ${{ github.event.inputs.urls }}
        run: |
          for u in $URLS; do
            for ua in "WhatsApp/2.23.20.0 A"; do
              R=$(curl -s -o page.html -w "%{http_code} %{time_total}s %{size_download}B" -A "$ua" "$u"); case "$u" in *api/save-map-element*|*api/lot-data*|*api/marina/marketplace*|*api/marina/store*|*api/marina/rentals*) echo "::notice title=json::$(head -c 3800 page.html)";; *melyos.io/menucheck*) echo "::notice title=menu::$(curl -sL https://melyos.io/ | grep -o "Who we serve\|Solutions\|Resources\|>RV Parks<\|>Explore<" | sort | uniq -c | tr "\n" " ")";; *marinademo*hdr*) echo "::notice title=hdr::burger=$(grep -o mr-burger page.html | wc -l) desk_login=$(grep -o 'mr-btn mr-desk' page.html | wc -l) menu_word=$(grep -o '>Menu <' page.html | wc -l)";; *marinademo*) echo "::notice title=rates::$(sed -n 's/.*id="rates"//p' page.html | sed 's/<[^>]*>/ /g; s/  */ /g' | head -c 1500)";; esac
              OG=$(grep -o "<meta property=\"og:\(image\|description\)\"[^>]*>" page.html | head -2 | tr "\n" " ")
              IDX=$(grep -bo 'og:image' page.html | head -1 | cut -d: -f1)
              echo "::notice title=$u [${ua%%/*}]::$R | og:image at byte ${IDX:-none} | ${OG:0:600}"
            done
          done
