# Oct 21 (per Mely): read-only check of what WhatsApp/Facebook see when a link is shared.
name: Link preview check
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Space-separated URLs'
        required: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in ${{ github.event.inputs.urls }}; do
            for ua in "WhatsApp/2.23.20.0 A" "facebookexternalhit/1.1"; do
              R=$(curl -s -o page.html -w "%{http_code} %{time_total}s %{size_download}B" -A "$ua" "$u")
              OG=$(grep -o '<meta property="og:image"[^>]*>' page.html | head -1)
              IDX=$(grep -bo 'og:image' page.html | head -1 | cut -d: -f1)
              echo "::notice title=$u [${ua%%/*}]::$R | og:image at byte ${IDX:-none} | ${OG:0:200}"
            done
          done
