# Oct 24 (per Mely): read-only screenshots of a page at phone / tablet / desktop widths.
name: Page screenshots
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL'
        required: true
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i -s playwright@1.47.2 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - env:
          URL: ${{ github.event.inputs.url }}
        run: |
          cat > shot.mjs <<'JS'
          import { chromium } from "playwright";
          const b = await chromium.launch();
          for (const [name, w, h, mobile] of [["phone", 390, 844, true], ["tablet", 820, 1180, true], ["desktop", 1366, 900, false]]) {
            const ctx = await b.newContext({ viewport: { width: w, height: h }, isMobile: mobile, deviceScaleFactor: 1 });
            const p = await ctx.newPage(); await p.goto(process.env.URL, { waitUntil: "networkidle", timeout: 60000 });
            await p.addStyleTag({ content: ".ck-banner,.ck-bar,[class*=cookie]{display:none!important}" }).catch(() => {});
            const rep = await p.evaluate(() => {
              const r = (el) => { const b = el.getBoundingClientRect(); return `${Math.round(b.left)},${Math.round(b.top)} ${Math.round(b.width)}x${Math.round(b.height)}`; };
              const btns = [...document.querySelectorAll(".mr-rs-actions .mr-btn")].map((b) => `${b.textContent.trim()}@${r(b)}`);
              const hero = document.querySelector(".mr-rs-hero"); const side = document.querySelector(".mr-rs-side"); const main = document.querySelector(".mr-rs-main");
              return { overflowX: document.documentElement.scrollWidth > window.innerWidth, hero: hero ? r(hero) : null, main: main ? r(main) : null, side: side ? r(side) : null, btns, menuPages: document.querySelectorAll(".mr-rs-menu-page").length, delivery: [...document.querySelectorAll(".mr-rs-dl")].map((d) => r(d)) };
            });
            console.log(`::notice title=${name} ${w}x${h}::${JSON.stringify(rep)}`);
            await ctx.close();
          }
          await b.close();
          JS
          node shot.mjs
